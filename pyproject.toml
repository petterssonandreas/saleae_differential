[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saleae-differential"
version = "0.1.0"
description = "Differential analog UART analysis using a Saleae Logic Pro 8"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15"]

[project.optional-dependencies]
automation = ["logic2-automation>=1.0.7,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
saleae-differential = "saleae_differential.gui:main"

[tool.setuptools.packages.find]
include = ["saleae_differential*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
